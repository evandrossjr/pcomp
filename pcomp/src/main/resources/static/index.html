<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Conferência Pedido x NF</title>
    <link rel="icon" href="data:,">
    <style>
        :root{
          --bg:#0b0f1a;
          --card:#0f172a;
          --muted:#94a3b8;
          --text:#e2e8f0;
          --line:rgba(148,163,184,.18);
          --accent:#60a5fa;
          --good:#22c55e;
          --bad:#ef4444;
        }

        *{ box-sizing:border-box; }

        body{
          margin:0;
          font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto;
          background: radial-gradient(1200px 600px at 20% -10%, rgba(96,165,250,.25), transparent 55%),
                      var(--bg);
          color:var(--text);
        }

        .wrap{
          max-width:1200px;
          margin:0 auto;
          padding:30px 20px 60px;
        }

        .topbar{
          display:flex;
          justify-content:space-between;
          align-items:center;
          margin-bottom:25px;
        }

        h2{
          margin:0;
          font-size:20px;
        }

        a{
          color:var(--accent);
          text-decoration:none;
          border:1px solid rgba(96,165,250,.3);
          padding:8px 14px;
          border-radius:10px;
          background:rgba(96,165,250,.1);
        }

        a:hover{
          background:rgba(96,165,250,.2);
        }

        .card{
          background:rgba(255,255,255,.02);
          border:1px solid var(--line);
          border-radius:16px;
          padding:18px;
        }

        .container{
          display:grid;
          grid-template-columns:1fr 1fr;
          gap:20px;
          margin-top:20px;
        }

        textarea{
          width:100%;
          height:220px;
          font-family:monospace;
          background:rgba(148,163,184,.06);
          border:1px solid var(--line);
          color:var(--text);
          border-radius:12px;
          padding:12px;
        }

        input{
          background:rgba(148,163,184,.06);
          border:1px solid var(--line);
          color:var(--text);
          border-radius:10px;
          padding:8px 10px;
        }

        button{
          border:1px solid var(--line);
          background:rgba(148,163,184,.08);
          color:var(--text);
          padding:10px 16px;
          border-radius:12px;
          cursor:pointer;
          margin-top:10px;
        }

        button:hover{
          background:rgba(148,163,184,.15);
        }

        .primary{
          border-color:rgba(96,165,250,.4);
          background:rgba(96,165,250,.2);
        }

        table{
          width:100%;
          border-collapse:separate;
          border-spacing:0;
          border:1px solid var(--line);
          border-radius:14px;
          margin-top:20px;
          overflow:hidden;
        }

        th, td{
          padding:10px;
          border-bottom:1px solid var(--line);
          font-size:13px;
        }

        th{
          background:rgba(148,163,184,.08);
          color:var(--muted);
          text-align:left;
        }

        tr:nth-child(even) td{
          background:rgba(148,163,184,.04);
        }

        tr:hover td{
          background:rgba(96,165,250,.08);
        }

        .ok{ color:var(--good); font-weight:bold; }
        .alerta{ color:var(--bad); font-weight:bold; }

        .small{
          font-size:12px;
          color:var(--muted);
        }

        @media(max-width:900px){
          .container{
            grid-template-columns:1fr;
          }
        }
    </style>
</head>
<body>
<div class="wrap">

    <div class="topbar">
        <h2>Conferência Pedido x NF</h2>
        <div>
            <a href="/xml.html">Ir para Extrator XML</a>
        </div>
    </div>

    <label>Tolerância (ex: 0.05)</label>
    <input type="number" id="tolerancia" step="0.01" value="0.00"/>

    <div class="container">
        <div class="card">
            <h3>JSON Pedido</h3>
            <textarea id="pedidoJson"></textarea>
        </div>

        <div class="card">
             <h3>JSON NF (cole 1 NF por vez)</h3>
            <textarea id="nfJson"></textarea>

            <div style="display:flex; gap:10px;">
                <button type="button" onclick="adicionarNf()">Adicionar NF</button>
                <button type="button" onclick="limparNfs()">Limpar NFs</button>
            </div>

            <div class="small" id="nfCount"></div>
            <div id="nfLista" class="nf-list"></div>
        </div>
    </div>

    <button onclick="analisar()">Analisar</button>
    <button class="btn copy" type="button" onclick="copiarTabela()">Copiar tabela</button>


    <div id="resultado"></div>
</div>
<script>
    const nfs = []; // lista de objetos NF

    function atualizarListaNfs() {
      document.getElementById("nfCount").innerText = `NFs adicionadas: ${nfs.length}`;

      const lista = document.getElementById("nfLista");
      if (nfs.length === 0) {
        lista.innerHTML = "";
        return;
      }

      lista.innerHTML = nfs.map((nf, idx) => {
        // tenta pegar um identificador amigável (se existir)
        const id =
          (nf.cabec && (nf.cabec.cNumeroNFe || nf.cabec.cChaveNFe)) ||
          (nf.cabecalho && (nf.cabecalho.cNumero || nf.cabecalho.cChave)) ||
          `NF ${idx + 1}`;

        return `
          <div class="nf-item">
            <span>#${idx + 1} - ${escapeHtml(String(id)).slice(0, 60)}</span>
            <button type="button" onclick="removerNf(${idx})">Remover</button>
          </div>
        `;
      }).join("");
    }

    function adicionarNf() {
      const nfText = document.getElementById("nfJson").value.trim();
      if (!nfText) return;

      try {
        const obj = JSON.parse(nfText);
        nfs.push(obj);
        document.getElementById("nfJson").value = "";
        atualizarListaNfs();
      } catch (e) {
        alert("NF não é um JSON válido.");
      }
    }

    function removerNf(i) {
      nfs.splice(i, 1);
      atualizarListaNfs();
    }

    function limparNfs() {
      nfs.length = 0;
      atualizarListaNfs();
    }

    async function analisar() {
        const pedidoText = document.getElementById("pedidoJson").value.trim();
        const tolerancia = parseFloat(document.getElementById("tolerancia").value) || 0;

        if (!pedidoText) {
          alert("Cole o JSON do pedido.");
          return;
        }
        if (nfs.length === 0) {
          alert("Adicione pelo menos 1 NF (botão Adicionar NF).");
          return;
        }

        try {
            const response = await fetch("/api/conferencia/analisar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    pedidoJson: JSON.parse(pedidoText),
                    nfsJson: nfs,
                    toleranciaValor: tolerancia
                })
            });

            const data = await response.json();

            if (!response.ok) {
                document.getElementById("resultado").innerHTML =
                    "<p class='alerta'>Erro: " + (data.mensagem || "Falha na requisição") + "</p>";
                return;
            }

            renderResultado(data);

        } catch (e) {
            document.getElementById("resultado").innerHTML =
                "<p class='alerta'>Erro ao processar JSON</p>";
        }
    }

     async function copiarTabela() {
        const table = document.querySelector("#resultado table");
        if (!table) {
          alert("Nenhuma tabela para copiar.");
          return;
        }

        const rows = Array.from(table.querySelectorAll("tr"));
        const tsv = rows.map(row => {
          const cells = Array.from(row.querySelectorAll("th,td"));
          return cells.map(c => (c.innerText || "").replace(/\t/g, " ").replace(/\n/g, " ")).join("\t");
        }).join("\n");

        // tenta clipboard moderno
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(tsv);
            alert("Tabela copiada! Agora é só colar no Excel.");
            return;
          }
        } catch (e) {
          // cai pro fallback abaixo
        }

        // fallback (funciona até sem https): cria textarea temporário
        const ta = document.createElement("textarea");
        ta.value = tsv;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);

        alert("Tabela copiada! Agora é só colar no Excel.");
    }


    function brl(v){
      if (v === null || v === undefined || v === "") return "";
      const n = Number(String(v).replace(",", "."));
      if (Number.isNaN(n)) return String(v);
      return n.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
    }

    function num(v){
      if (v === null || v === undefined || v === "") return "";
      const n = Number(String(v).replace(",", "."));
      if (Number.isNaN(n)) return String(v);
      return n.toLocaleString("pt-BR");
    }

    function brl(v){
      if (v === null || v === undefined || v === "") return "";
      const n = Number(String(v).replace(",", "."));
      if (Number.isNaN(n)) return String(v);
      return n.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
    }

    function num(v){
      if (v === null || v === undefined || v === "") return "";
      const n = Number(String(v).replace(",", "."));
      if (Number.isNaN(n)) return String(v);
      return n.toLocaleString("pt-BR");
    }

    function renderResultado(data) {
        let html = "";

        html += "<p>Status: <span class='" + (data.status === "OK" ? "ok" : "alerta") + "'>" + data.status + "</span></p>";
        html += "<p>Pedido: " + data.pedidoId + " | NF(s): " + data.nfId + "</p>";
        html += "<p><b>Produtos (únicos):</b> Pedido = " + data.itensPedido + " | NF = " + data.itensNf + "</p>";

        if (!data.alertas || data.alertas.length === 0) {
            html += "<p class='ok'>Nenhuma divergência encontrada.</p>";
        } else {
            html += "<table>";
            html += "<tr>"
             + "<th>Chave</th><th>Descrição</th><th>SKU Pedido</th><th>SKU NF</th>"
             + "<th>Qtd</th><th>Status Preço</th><th>Status Cadastro</th>"
             + "<th>Qtd Pedido</th><th>Valor Unit Pedido</th>"
             + "<th>Qtd NF</th><th>Valor Unit NF</th>"
             + "<th>Total Pedido</th><th>Total NF</th>"
             + "</tr>";

            data.alertas.forEach(a => {
              html += "<tr>";
              html += "<td>" + (a.chave || "") + "</td>";
              html += "<td>" + (a.descricao || "") + "</td>";
              html += "<td>" + (a.skuPedido || "-") + "</td>";
              html += "<td>" + (a.skuNf || "-") + "</td>";

              // Qtd (mostrar pendente/a mais)
              // qtdDiferenca > 0 => pendente; < 0 => a mais
              let qtdTxt = "-";
              if (a.qtdDiferenca !== null && a.qtdDiferenca !== undefined) {
                const q = Number(a.qtdDiferenca);
                if (q > 0) qtdTxt = "Pendente: " + num(q);
                else if (q < 0) qtdTxt = "A mais: " + num(Math.abs(q));
                else qtdTxt = "OK";
              }
              html += "<td>" + (a.statusQuantidade || "") + " • " + qtdTxt + "</td>";

              // Status preço: vem texto, mas trocar o número por BRL
              html += "<td>" + formatPrecoTexto(a.statusPrecoTexto) + "</td>";

              html += "<td>" + (a.avisoCadastro || "") + "</td>";

              html += "<td>" + num(a.qtdPedido) + "</td>";
              html += "<td>" + brl(a.valorUnitPedido) + "</td>";

              html += "<td>" + num(a.qtdNf) + "</td>";
              html += "<td>" + brl(a.valorUnitNf) + "</td>";

              html += "<td>" + brl(a.totalPedido) + "</td>";
              html += "<td>" + brl(a.totalNf) + "</td>";
              html += "</tr>";
            });

            html += "</table>";
        }

        document.getElementById("resultado").innerHTML = html;
    }

    function formatPrecoStatus(s){
      if (!s) return "";
      // casos "R$ 0" ou "-R$ 0.15" ou "R$ 0.15"
      const neg = s.startsWith("-R$");
      const numStr = s.replace("-R$", "").replace("R$", "").trim();
      const n = Number(numStr.replace(",", "."));
      if (Number.isNaN(n)) return s; // fallback

      const br = n.toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
      return neg ? "-" + br : br;
    }

    function formatPrecoTexto(s){
      if (!s) return "";
      // s pode ser: "+ 1.23 (A MAIS)" ou "- 2.50 (A MENOS)" ou "- (SEM MUDANÇA)"
      if (s.startsWith("- (SEM")) return s;

      const m = s.match(/^([+-])\s*([0-9.,]+)\s*(.*)$/);
      if (!m) return s;

      const sinal = m[1];
      const valor = brl(m[2]);
      const resto = m[3] || "";
      return `${sinal} ${valor} ${resto}`.trim();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[m]));
    }

    atualizarListaNfs();
</script>

</body>
</html>
