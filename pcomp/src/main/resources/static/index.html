<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Conferência Pedido x NF</title>
    <link rel="icon" href="data:,">
    <style>
        :root{
          --bg:#0b0f1a;
          --card:#0f172a;
          --muted:#94a3b8;
          --text:#e2e8f0;
          --line:rgba(148,163,184,.18);
          --accent:#60a5fa;
          --good:#22c55e;
          --bad:#ef4444;
        }

        *{ box-sizing:border-box; }

        body{
          margin:0;
          font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto;
          background: radial-gradient(1200px 600px at 20% -10%, rgba(96,165,250,.25), transparent 55%),
                      var(--bg);
          color:var(--text);
        }

        .wrap{
          max-width:1200px;
          margin:0 auto;
          padding:30px 20px 60px;
        }

        .topbar{
          display:flex;
          justify-content:space-between;
          align-items:center;
          margin-bottom:25px;
        }

        h2{
          margin:0;
          font-size:20px;
        }

        a{
          color:var(--accent);
          text-decoration:none;
          border:1px solid rgba(96,165,250,.3);
          padding:8px 14px;
          border-radius:10px;
          background:rgba(96,165,250,.1);
        }

        a:hover{
          background:rgba(96,165,250,.2);
        }

        .card{
          background:rgba(255,255,255,.02);
          border:1px solid var(--line);
          border-radius:16px;
          padding:18px;
        }

        .container{
          display:grid;
          grid-template-columns:1fr 1fr;
          gap:20px;
          margin-top:20px;
        }

        textarea{
          width:100%;
          height:220px;
          font-family:monospace;
          background:rgba(148,163,184,.06);
          border:1px solid var(--line);
          color:var(--text);
          border-radius:12px;
          padding:12px;
        }

        input{
          background:rgba(148,163,184,.06);
          border:1px solid var(--line);
          color:var(--text);
          border-radius:10px;
          padding:8px 10px;
        }

        button{
          border:1px solid var(--line);
          background:rgba(148,163,184,.08);
          color:var(--text);
          padding:10px 16px;
          border-radius:12px;
          cursor:pointer;
          margin-top:10px;
        }

        button:hover{
          background:rgba(148,163,184,.15);
        }

        .primary{
          border-color:rgba(96,165,250,.4);
          background:rgba(96,165,250,.2);
        }

        table{
          width:100%;
          border-collapse:separate;
          border-spacing:0;
          border:1px solid var(--line);
          border-radius:14px;
          margin-top:20px;
          overflow:hidden;
        }

        th, td{
          padding:10px;
          border-bottom:1px solid var(--line);
          font-size:13px;
        }

        th{
          background:rgba(148,163,184,.08);
          color:var(--muted);
          text-align:left;
        }

        tr:nth-child(even) td{
          background:rgba(148,163,184,.04);
        }

        tr:hover td{
          background:rgba(96,165,250,.08);
        }

        .ok{ color:var(--good); font-weight:bold; }
        .alerta{ color:var(--bad); font-weight:bold; }

        .small{
          font-size:12px;
          color:var(--muted);
        }

        @media(max-width:900px){
          .container{
            grid-template-columns:1fr;
          }
        }
    </style>
</head>
<body>
<div class="wrap">

    <div class="topbar">
        <h2>Conferência Pedido x NF</h2>
        <div>
            <a href="/xml.html">Ir para Extrator XML</a>
        </div>
    </div>

    <label>Tolerância (ex: 0.05)</label>
    <input type="number" id="tolerancia" step="0.01" value="0.00"/>

    <div class="container">
        <div class="card">
            <h3>JSON Pedido</h3>
            <textarea id="pedidoJson"></textarea>
        </div>

        <div class="card">
             <h3>JSON NF (cole 1 NF por vez)</h3>
            <textarea id="nfJson"></textarea>

            <div style="display:flex; gap:10px;">
                <button type="button" onclick="adicionarNf()">Adicionar NF</button>
                <button type="button" onclick="limparNfs()">Limpar NFs</button>
            </div>

            <div class="small" id="nfCount"></div>
            <div id="nfLista" class="nf-list"></div>
        </div>
    </div>

    <button onclick="analisar()">Analisar</button>

    <div id="resultado"></div>
</div>
<script>
    const nfs = []; // lista de objetos NF

    function atualizarListaNfs() {
      document.getElementById("nfCount").innerText = `NFs adicionadas: ${nfs.length}`;

      const lista = document.getElementById("nfLista");
      if (nfs.length === 0) {
        lista.innerHTML = "";
        return;
      }

      lista.innerHTML = nfs.map((nf, idx) => {
        // tenta pegar um identificador amigável (se existir)
        const id =
          (nf.cabec && (nf.cabec.cNumeroNFe || nf.cabec.cChaveNFe)) ||
          (nf.cabecalho && (nf.cabecalho.cNumero || nf.cabecalho.cChave)) ||
          `NF ${idx + 1}`;

        return `
          <div class="nf-item">
            <span>#${idx + 1} - ${escapeHtml(String(id)).slice(0, 60)}</span>
            <button type="button" onclick="removerNf(${idx})">Remover</button>
          </div>
        `;
      }).join("");
    }

    function adicionarNf() {
      const nfText = document.getElementById("nfJson").value.trim();
      if (!nfText) return;

      try {
        const obj = JSON.parse(nfText);
        nfs.push(obj);
        document.getElementById("nfJson").value = "";
        atualizarListaNfs();
      } catch (e) {
        alert("NF não é um JSON válido.");
      }
    }

    function removerNf(i) {
      nfs.splice(i, 1);
      atualizarListaNfs();
    }

    function limparNfs() {
      nfs.length = 0;
      atualizarListaNfs();
    }

    async function analisar() {
        const pedidoText = document.getElementById("pedidoJson").value.trim();
        const tolerancia = parseFloat(document.getElementById("tolerancia").value) || 0;

        if (!pedidoText) {
          alert("Cole o JSON do pedido.");
          return;
        }
        if (nfs.length === 0) {
          alert("Adicione pelo menos 1 NF (botão Adicionar NF).");
          return;
        }

        try {
            const response = await fetch("/api/conferencia/analisar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    pedidoJson: JSON.parse(pedidoText),
                    nfsJson: nfs,
                    toleranciaValor: tolerancia
                })
            });

            const data = await response.json();

            if (!response.ok) {
                document.getElementById("resultado").innerHTML =
                    "<p class='alerta'>Erro: " + (data.mensagem || "Falha na requisição") + "</p>";
                return;
            }

            renderResultado(data);

        } catch (e) {
            document.getElementById("resultado").innerHTML =
                "<p class='alerta'>Erro ao processar JSON</p>";
        }
    }

    function renderResultado(data) {
        let html = "";

        html += "<p>Status: <span class='" + (data.status === "OK" ? "ok" : "alerta") + "'>" + data.status + "</span></p>";
        html += "<p>Pedido: " + data.pedidoId + " | NF(s): " + data.nfId + "</p>";
        html += "<p><b>Produtos (únicos):</b> Pedido = " + data.itensPedido + " | NF = " + data.itensNf + "</p>";

        if (!data.alertas || data.alertas.length === 0) {
            html += "<p class='ok'>Nenhuma divergência encontrada.</p>";
        } else {
            html += "<table>";
            html += "<tr><th>Chave</th><th>Descrição</th><th>SKU Pedido</th><th>SKU NF</th><th>Qtd Status</th><th>Preço Status</th><th>Cadastro</th><th>Qtd Pedido</th><th>Qtd NF</th><th>Total Pedido</th><th>Total NF</th></tr>";

            data.alertas.forEach(a => {
              html += "<tr>";
              html += "<td>" + (a.chave || "") + "</td>";
              html += "<td>" + (a.descricao || "") + "</td>";
              html += "<td>" + (a.skuPedido || "-") + "</td>";
              html += "<td>" + (a.skuNf || "-") + "</td>";
              html += "<td>" + (a.statusQuantidade || "") + "</td>";
              html += "<td>" + (a.statusPreco || "") + "</td>";
              html += "<td>" + (a.avisoCadastro || "") + "</td>";
              html += "<td>" + (a.qtdPedido ?? "") + "</td>";
              html += "<td>" + (a.qtdNf ?? "") + "</td>";
              html += "<td>" + (a.totalPedido ?? "") + "</td>";
              html += "<td>" + (a.totalNf ?? "") + "</td>";
              html += "</tr>";
            });

            html += "</table>";
        }

        document.getElementById("resultado").innerHTML = html;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[m]));
    }

    atualizarListaNfs();
</script>

</body>
</html>
